[project]
name = "cosyvoice"
version = "3.0.0"
description = "CosyVoice3 引擎（含 f0 补丁，供声刻 Studio 调用）"
requires-python = ">=3.10,<3.12"  # pyworld 0.3.4 只提供 cp310/cp311 轮子
dependencies = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0; sys_platform == 'linux'",
    "onnxruntime==1.18.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "python-multipart==0.0.12",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "setuptools<81",  # lightning 2.2.4 仍用 pkg_resources 声明命名空间，setuptools>=81 已移除
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "tensorrt-cu12==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-bindings==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-libs==10.13.3.9; sys_platform == 'linux'",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers==4.51.3",
    "x-transformers==2.11.24",
    "uvicorn==0.30.0",
    "wetext==0.0.4",
    "wget==3.2",
]

# 训练依赖：默认不安装。deepspeed 只有训练脚本用；Windows 上解析它的 linux-only
# sdist 会执行 setup.py（win32 默认 DS_BUILD_OPS=1 且隔离环境无 torch，直接断言失败）。
[project.optional-dependencies]
train = ["deepspeed==0.15.1; sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
# 声刻 Studio 只发布 Windows 版本。限制解析平台，避免 uv 在 Windows 上为
# linux-only 依赖（deepspeed / tensorrt-cu12* / onnxruntime-gpu）构建 sdist
# 元数据时段言失败——这正是首次 uv sync 失败的原因。
environments = ["sys_platform == 'win32'"]

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]
